# ======================================================
# SonarCloud — конфігурація проєкту BeatStream
# Лабораторна Робота №1: Автоматизований контроль якості
# ======================================================

# --- Ідентифікатори проєкту ---
# Organization = ваш GitHub нікнейм (lowercase)
sonar.organization=vabu000
sonar.projectKey=Vabu000_BeatStream
sonar.projectName=BeatStream
sonar.projectVersion=1.0

# --- Хост ---
sonar.host.url=https://sonarcloud.io

# --- Вихідний код ---
# Аналізуємо лише основний модуль app (Kotlin-файли)
sonar.sources=app/src/main/java
sonar.tests=app/src/test/java,app/src/androidTest/java

# --- Бінарні файли (скомпільований код для точнішого аналізу) ---
sonar.java.binaries=app/build/intermediates/javac/debug/compileDebugJavaWithJavac/classes
sonar.kotlin.binaries=app/build/tmp/kotlin-classes/debug

# --- Покриття тестами ---
# Якщо є JaCoCo-звіти — SonarCloud підхопить автоматично
sonar.coverage.jacoco.xmlReportPaths=app/build/reports/jacoco/testDebugUnitTestCoverage/testDebugUnitTestCoverage.xml

# --- Виключення з аналізу ---
# Виключаємо згенерований код Room, теми та Preview-composables
sonar.exclusions=\
  app/src/main/java/**/ui/theme/**,\
  app/build/**,\
  **/*_MembersInjector.java,\
  **/*Factory.java,\
  **/*Database_Impl.java

# --- Мова та кодування ---
sonar.sourceEncoding=UTF-8
sonar.java.source=11
sonar.java.target=11
