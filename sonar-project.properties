# ======================================================
# SonarCloud — конфiгурацiя проєкту BeatStream
# ЛР №1: Автоматизований контроль якостi
# Запуск: standalone sonar-scanner CLI (scan.bat)
# ======================================================

# --- Iдентифiкатори проєкту ---
sonar.organization=vabu000
sonar.projectKey=Vabu000_BeatStream
sonar.projectName=BeatStream
sonar.projectVersion=1.0

# --- Хост ---
sonar.host.url=https://sonarcloud.io

# --- Вихiдний код ---
sonar.sources=app/src/main/java
sonar.tests=app/src/test/java,app/src/androidTest/java

# --- Бiнарнi файли для глибшого аналiзу ---
# Папка з .class файлами пiсля assembleDebug
sonar.java.binaries=app/build/intermediates/javac/debug/compileDebugJavaWithJavac/classes,\
  app/build/tmp/kotlin-classes/debug

# --- Виключення з аналiзу ---
# Тема, Preview-composables, згенерований код Room
sonar.exclusions=\
  app/src/main/java/**/ui/theme/**,\
  app/build/**,\
  **/*_Impl.java,\
  **/*Factory.java

# --- Покриття тестами ---
sonar.coverage.jacoco.xmlReportPaths=\
  app/build/reports/jacoco/testDebugUnitTestCoverage/testDebugUnitTestCoverage.xml

# --- Мова та кодування ---
sonar.sourceEncoding=UTF-8
sonar.java.source=11
sonar.java.target=11

# --- Kotlin ---
sonar.kotlin.source.version=1.9
