name: Quality governance

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Lizard
        run: python -m pip install lizard==1.24.3

      - name: Run unit tests
        run: bash ./gradlew :app:testDebugUnitTest

      - name: Generate complexity and churn report
        run: python scripts/audit/quality_report.py

      - name: Upload JSON report
        uses: actions/upload-artifact@v4
        with:
          name: beatstream-quality-report
          path: build/reports/quality/hotspots.json
          if-no-files-found: error
          retention-days: 30

  sonarcloud:
    if: ${{ vars.SONAR_SCAN_ENABLED == 'true' }}
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Compile Kotlin for analysis
        run: bash ./gradlew :app:compileDebugKotlin

      - name: Scan with SonarCloud
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      - name: Fetch SonarCloud metrics
        shell: pwsh
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./scripts/audit/sonar_metrics.ps1

      - name: Upload SonarCloud JSON
        uses: actions/upload-artifact@v4
        with:
          name: beatstream-sonar-metrics
          path: build/reports/sonar/*.json
          if-no-files-found: error
          retention-days: 30
